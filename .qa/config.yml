# .qa/config.yml — per-project integration surface for qa-kit.
# Generated by /qa-init on 2026-09-11 against branch feature/edit-docs.
#
# Package manager, test runner, coverage and mutation tooling are auto-detected
# by scripts/detect-stack.sh on every run and deliberately NOT restated here.

version: 2

project:
  kind: monorepo
  description: >
    DocSync — an offline-first collaborative document editor. Next.js PWA (apps/web)
    plus an Express + Prisma/Postgres API (apps/server). Plain-text documents with an
    explicit Save (no autosave), Yjs-based save-and-merge, per-browser IndexedDB local
    drafts, and owner/editor/viewer roles. Risk profile is DATA LOSS, not money: a
    user's unsaved draft is the asset, and the sync-status badge is the only signal
    they have about whether their work is safe. Auth is Google OAuth only.
  # No root `dev` script. The real sequence, per docs/phase1-part2-prd.md §3:
  #   docker compose up -d           # Postgres (Playwright does NOT manage the DB)
  #   pnpm --filter server dev       # API  :3000
  #   pnpm --filter web dev          # app  :4000
  # Playwright's webServer starts both apps itself, but the DB must be up first.
  dev_command: "docker compose up -d && pnpm --filter server dev & pnpm --filter web dev"
  base_url: "http://localhost:4000"
  # QA applies to both apps. packages/shared is type declarations only (one file,
  # no runtime behaviour) and is covered transitively by its consumers.
  packages:
    - apps/web
    - apps/server

# ---------------------------------------------------------------------------
# Where intent lives. This project is unusually well served here: docs/ holds a
# PRD, a tech spec and a per-phase QA-facing behaviour doc.
# ---------------------------------------------------------------------------
requirements:
  docs_dir: docs
  doc_globs:
    - "docs/*-prd.md"
    - "docs/*prd*.md"
    - "docs/*techspec*.md"
    - "docs/userflow-diagram.md"
    - "docs/user-journey.md"
  # Highest-value sources, in priority order. phase1-part2-prd.md is explicitly
  # written for QA ("Status: Ready for QA") and states expected behaviour rather
  # than implementation — prefer it over the tech spec whenever they overlap.
  primary_docs:
    - "docs/docsync-master-spec.md"   # editor behaviour + §7 explicit out-of-scope list
  tracker:
    kind: github        # remote: github.com/shivams10/OfflineDocs
    # No ticket-key pattern (ABC-123) in any of the 20 commits; history uses
    # conventional-ish prefixes (feat:/add:/fix:) and PR numbers instead.
    project_key: ""
    base_url: "https://github.com/shivams10/OfflineDocs"
    ac_fields: ["body", "comments"]
  design:
    # No Figma. Designs were delivered as `.dc.html` design-reference files
    # (DocSync-PRD.md §12) and are not in the repo. Screens are referenced by id
    # throughout the PRD (`1a`-`8e`) and tokens live in docs/DESIGN_SYSTEM.md.
    kind: none
    files: []
  api_schema: none      # no OpenAPI/GraphQL schema; routes are Zod-validated Express

# ---------------------------------------------------------------------------
# Levels. There are currently ZERO test files in the repo — every level below is
# "harness present, suite empty", not "harness proven". Vitest projects, jsdom +
# Testing Library, supertest and Playwright are all installed and configured.
# ---------------------------------------------------------------------------
levels:
  # Trophy, deliberately. The complexity in the changed vertical is not pure
  # functions — it is a UI state machine (Draft → Saving… → Saved / Save failed /
  # Offline), IndexedDB persistence across reloads, and cross-tab dirty-state
  # propagation. Rendering the editor with its real children and asserting the
  # badge is worth more per unit of effort than unit-testing the hooks apart from
  # the DOM. The server half leans pyramid/glue; where the two disagree, the
  # server's authz and Yjs-merge logic is covered by integration tests through
  # supertest rather than by unit tests of controllers.
  shape: trophy

  static:
    available: true
    # apps/web has `pnpm lint` (eslint-config-next). apps/server has NO lint
    # script — typecheck it with `pnpm --filter server exec tsc --noEmit`.
    notes: "eslint in apps/web only; use tsc --noEmit for apps/server"

  # Co-located, per both vitest configs' include patterns. Asserted from config,
  # not from majority-of-files: there are 0 test files to count.
  unit:
    available: true
    dir: "apps"
    pattern: "**/*.test.{ts,tsx}"

  # supertest ^7.2.2 + @types/supertest are installed in apps/server but unused.
  # Needs a live Postgres (docker compose up -d) and a migrated schema.
  integration:
    available: true
    dir: "apps/server/src"
    pattern: "**/*.test.ts"
    notes: "supertest installed, unused; requires docker compose Postgres + prisma migrate"

  contract:
    available: false
    # Needs an OpenAPI schema or a Pact/schemathesis harness. Neither exists.
    dir: "tests/contract"

  # @testing-library/react, user-event, jest-dom and jsdom are installed and
  # wired via apps/web/vitest.setup.ts. NOT Storybook — the template's
  # *.stories.tsx pattern does not apply here.
  component:
    available: true
    dir: "apps/web"
    pattern: "**/*.test.tsx"

  # This project has a real 3-role matrix (owner/editor/viewer) enforced by
  # middleware/require-role.ts, and the PRD ships an explicit role table (§4).
  # Highest-value authz surface in the repo. Exercised through supertest.
  authz:
    available: true
    dir: "apps/server/src"
    pattern: "**/*.test.ts"

  e2e:
    available: true
    dir: "e2e"
    # playwright.config.ts sets testDir "./e2e" — THE DIRECTORY DOES NOT EXIST YET.
    # Harness is otherwise real: chromium project, webServer for both apps,
    # baseURL :4000, trace on-first-retry, 2 retries in CI.
    max_per_plan: 5

  visual:
    available: false
    dir: "e2e/visual"

  a11y:
    # The PRD has concrete a11y requirements (DocSync-PRD.md §10: 4.5:1 contrast,
    # visible focus ring, prefers-reduced-motion, 44px touch targets, "sync state
    # communicated by label and icon, not colour alone") — but NO tooling is
    # installed. Needs @axe-core/playwright (or jest-axe for component level).
    available: false
    standard: "wcag21aa"

  perf:
    available: false
    budgets: { lcp_ms: 2500, api_p95_ms: 400 }

# ---------------------------------------------------------------------------
# E2E specifics.
#
# TODO(human) — THE BLOCKER: there is no way for an automated browser to reach a
# logged-in state. Auth is Google OAuth only and the project says so explicitly
# (docs/phase1-part2-prd.md §3.4: "Sign in with a real Google account — auth is
# Google OAuth only, no test/mock login exists"). Driving Google's consent screen
# from Playwright is unreliable and against Google's terms.
#
# The tractable fix, in preference order:
#  1. A test-only session-minting route (NODE_ENV=test only) that calls
#     lib/jwt.ts signAccessToken() + lib/cookies.ts setAccessTokenCookie/
#     setCsrfCookie() for a seeded user. Everything needed already exists and is
#     already factored — this is the cheapest real unlock.
#  2. An auth.setup.ts that mints the same cookies out-of-band and writes a
#     Playwright storageState. Note cookie paths differ: docsync_access and
#     docsync_csrf are path "/", docsync_refresh is path "/auth" — a storage
#     state that gets these wrong will half-work and look like a flake.
#  3. Seed users + a DocCollaborator row directly (prisma studio), per the PRD's
#     §3 workaround, for the viewer/editor roles.
# Until one of these lands, e2e and /qa-explore cannot run authenticated flows.
# ---------------------------------------------------------------------------
e2e:
  framework: playwright
  base_url_env: PLAYWRIGHT_BASE_URL
  auth_setup: e2e/setup/auth.setup.ts
  storage_state_dir: e2e/.auth
  roles:
    # Roles come from middleware/require-role.ts and the PRD §4 table. There is
    # no sharing UI yet (Phase 3), so editor/viewer require a DocCollaborator row
    # inserted directly in the DB for a second test account.
    - { name: owner,  storage_state: "e2e/.auth/owner.json" }
    - { name: editor, storage_state: "e2e/.auth/editor.json" }
    - { name: viewer, storage_state: "e2e/.auth/viewer.json" }
    - { name: anon,   storage_state: null }
  browsers: [chromium]
  viewports:
    # Both matter: the PRD specifies a desktop top bar and a mobile bottom bar
    # with DIFFERENT Save button locations (§5.4, §6), so save/viewer scenarios
    # must be asserted at both widths.
    - { name: desktop, width: 1440, height: 900 }
    - { name: mobile,  width: 390,  height: 844 }
  seed_command: ""
  reset_command: ""

selectors:
  # No existing tests, so this is a policy choice, not an observed convention:
  # zero occurrences of data-testid, getByRole, getByTestId or data-cy anywhere
  # in apps/. Role-first is the right default here because the PRD's assertions
  # are almost all user-visible text — badge labels ("Draft", "Saving…", "Saved",
  # "Save failed", "Offline", "View only"), placeholders ("Untitled document",
  # "Start writing…") and banner copy. Those strings are centralised in
  # apps/web/constants/labels.ts — assert against that module, never a hardcoded
  # literal, or a copy change breaks every test at once.
  priority: [role_and_name, label, placeholder, testid, text]
  testid_attribute: data-testid
  forbidden:
    - "nth-child"
    - "nth-of-type"
    - "xpath="
    - "#__next"          # Next.js app-shell internals
    - ".css-"
    # Tailwind v4 utility classes are restyling churn, not identity. Base UI
    # renders unprefixed internals, so there is no stable class hook to lean on.
    - "[class*='bg-']"
    - "[class*='flex']"
    - "data-slot"        # shadcn/Base UI internal wiring, not a contract

# ---------------------------------------------------------------------------
# Traceability. AC ids come from .qa/basis/*.md, seeded from the PRDs.
# ---------------------------------------------------------------------------
traceability:
  enabled: true
  tag_format: "[{ac_id}]"
  basis_dir: .qa/basis
  # Off on day one: the suite is empty, so every criterion is a gap and turning
  # this on would fail 100% of runs.
  fail_on_gap: false
  min_coverage: 0.0

# ---------------------------------------------------------------------------
# Risk model. This product's catastrophic failure is silent data loss — a user
# who believes their work is saved when it is not, or a draft destroyed on
# reload. That, plus the auth/authz surface, sets the P0 floor.
# ---------------------------------------------------------------------------
risk:
  critical_paths:
    # Auth + session. Google-only OAuth, JWT access + rotating refresh, CSRF.
    - "apps/server/src/lib/jwt.ts"
    - "apps/server/src/lib/cookies.ts"
    - "apps/server/src/lib/crypto.ts"
    - "apps/server/src/middleware/auth.ts"
    - "apps/server/src/middleware/csrf.ts"
    - "apps/server/src/services/auth.ts"
    - "apps/server/src/services/oauth/**"
    - "apps/server/src/controllers/auth.ts"
    # Authorisation. Owner/editor/viewer, and the deliberate 404-not-403 leak
    # policy for non-collaborators (phase1-techspec §5.1).
    - "apps/server/src/middleware/require-role.ts"
    # Data loss surface: the Yjs merge on save, and the local-draft layer that is
    # the ONLY copy of unsaved work.
    - "apps/server/src/services/docs.ts"
    - "apps/web/lib/documents/use-yjs-doc.ts"
    - "apps/web/lib/documents/dirty-docs.ts"
    - "apps/web/lib/documents/base64.ts"
    # Schema changes.
    - "apps/server/prisma/migrations/**"
    - "apps/server/prisma/schema.prisma"
  # Empty by design: no smoke suite exists yet. First e2e spec written should be
  # e2e/smoke.spec.ts, and it belongs here the moment it lands.
  always_run: []
  impact_map:
    "apps/server/src/routes/docs.ts":        ["apps/server/src/controllers/docs.test.ts"]
    "apps/server/src/services/docs.ts":      ["apps/server/src/services/docs.test.ts"]
    "apps/server/src/middleware/require-role.ts": ["apps/server/src/middleware/require-role.test.ts"]
    "apps/server/src/services/oauth/**":     ["apps/server/src/controllers/auth.test.ts"]
    "apps/web/components/documents/doc-editor.tsx": ["apps/web/components/documents/doc-editor.test.tsx"]
    "apps/web/lib/documents/**":             ["apps/web/lib/documents"]
    "apps/web/app/(protected)/doc/[id]/**":  ["e2e/editor.spec.ts"]
    "apps/web/app/(protected)/dashboard/**": ["e2e/dashboard.spec.ts"]
    "apps/web/app/(public)/login/**":        ["e2e/auth.spec.ts"]

quality:
  mutation:
    # No mutation tool is installed (detect-stack: mutation_tool=none) and
    # allow_new_dependencies is false, so this cannot run today. Enabling it
    # would need @stryker-mutator/core + the vitest runner — worth doing once
    # there are real tests to mutate, and pointed at the critical_paths above.
    enabled: false
    scope: changed
    threshold: 60
    blocking: false
  coverage:
    # @vitest/coverage-v8 is NOT installed either — `vitest run --coverage` will
    # prompt to install it. Thresholds stay 0 until it is a devDependency.
    changed_files_threshold: 0.0
    blocking: false
  # The anti-tautology gate. Non-negotiable on an empty suite: a brand-new test
  # that has never been seen to fail is indistinguishable from no test.
  require_proven_failure: true

flake:
  quarantine_tag: "@quarantined"
  reruns: 2
  fail_rate_threshold: 0.05
  auto_quarantine: false
  ledger: .qa/history/flake.jsonl

run:
  # `propose`, deliberately — and this is not the usual day-one caution.
  # CLAUDE.md Rule 2 is explicit: "Do not create, edit, or modify files unless
  # the current request explicitly asks for that edit." This is the owner's
  # learning project and writing the code themselves is the point. QA agents
  # plan and report; they write test code only when asked for it by name
  # (/qa-implement). Do not raise this without the owner saying so.
  autonomy: propose

  default_mode: changed
  fail_fast: false
  parallel: auto
  artifacts_dir: .qa/runs
  autorun_levels: [static, unit, component]

  # How much work a run is allowed to decide to do.
  #
  # Nothing used to bound this. A 17-file diff produced 52 scenarios and 115
  # tests across 14 subagents, cost 91.6M tokens and exhausted an account limit.
  # No single decision was unreasonable; nothing added them up.
  #
  # This is the largest cost lever there is. Measured on that run's own model,
  # halving the scenarios costs roughly a fifth as much — far more than any
  # change to how agents read artifacts, and more than agent count.
  #
  #   quick     runner + triager only. "did I break anything."
  #   standard  the ordinary case. Plan capped; no adversary, no mutation pass.
  #   deep      everything, for critical paths. Costs what it costs.
  #   auto      scored from the diff — critical-path match, migrations, churn,
  #             and historical defect density for the touched files.
  tier: auto
  min_priority: P2
  max_scenarios:
    quick: 0
    standard: 20
    deep: 60
  # A planner that wants more must cut, or the developer must say deep out loud.
  # Over-cap plans are rejected by qa-validate, not negotiated with.
  on_over_cap: reject

  # Which tests a run executes.
  #
  #   new       only the tests this run just wrote. Fastest. You find out whether
  #             the new tests pass; you do NOT find out whether the change broke
  #             something that already existed.
  #   related   the new tests plus existing tests covering the changed files and
  #             what imports them, from .qa/map.txt. Catches regressions.
  #   all       the whole suite. Slow on any real repo.
  #
  # Test execution is cheap — it is a shell command, not agent turns — so
  # `related` costs seconds rather than tokens. `new` is the right choice when
  # you are running the suite yourself anyway, or in CI, and want the plugin to
  # confirm only its own work.
  execution: auto
  test_commands:
    # `dir` is where the command runs from. pnpm --filter changes the working
    # directory, so paths must be relative to it — without this, vitest silently
    # ran 7 of the 12 files it was given.
    web:    { command: "pnpm exec vitest run", dir: "apps/web" }
    server: { command: "pnpm exec vitest run", dir: "apps/server" }

  test_selection: related




  # integration/authz are NOT autorun: they need docker compose Postgres up and a
  # migrated schema, so running them unprompted fails confusingly on a cold machine.

# ---------------------------------------------------------------------------
# Blast radius.
# ---------------------------------------------------------------------------
boundaries:
  never_modify:
    - "apps/server/src/generated/**"     # Prisma client output (gitignored)
    - "apps/server/prisma/migrations/**" # applied migrations
    - "pnpm-lock.yaml"
    - "**/*.lock"
    - "docker-compose.yml"
    - "apps/server/.env"
    - ".github/workflows/**"
    - "docs/**"                          # the oracle; agents read it, never edit it
  human_review_only:
    - "apps/server/src/lib/jwt.ts"
    - "apps/server/src/lib/cookies.ts"
    - "apps/server/src/lib/crypto.ts"
    - "apps/server/src/middleware/**"
    - "apps/server/src/services/oauth/**"
    - "apps/server/src/services/auth.ts"
  allowed_source_changes:
    # add_testid is allowed but should be a last resort — the selector policy is
    # role/label-first precisely because an unnameable control is an a11y defect
    # worth surfacing rather than papering over with a testid.
    - add_accessible_name
    - add_testid
    - export_for_test
  allow_new_dependencies: false

trace:
  level: decisions
  redact: [password, token, secret, apikey, authorization, jwt_secret, google_client_secret, database_url]

reporting:
  dir: .qa
  commit_artifacts: [basis, plans, traceability.md, history]
  pr_comment: true


# ---------------------------------------------------------------------------
# Spend caps. Checked while the run is still running, not only at the end.
#
# The run these exist for: 91.6M tokens, 14 subagents, exhausted one account's
# limit and half of a second, stopped for three hours mid-triage. Nothing
# bounded it and nothing warned.
#
# Measured from that run's own transcripts:
#   cost(agent) = base x turns + growth x turns(turns+1)/2
#   base ~35k per subagent (~73k orchestrator), growth ~1.6k per turn
#   => base x turns was 30% of the bill; accumulated growth was 70%
#
# So the caps that bite are the per-agent ones. One agent taking 122 turns costs
# about five times what five agents taking 24 turns each cost for the same work,
# because growth is quadratic in a single agent's turn count.
# ---------------------------------------------------------------------------
budget:
  max_tokens_per_run: 25_000_000
  max_minutes_per_run: 45
  # How many agents may run at once. Agents are safe to parallelise because the
  # partitioner assigns each one its own TEST file to write — they only read the
  # source they cover. Raised 3 -> 6 after a run where two waves cost ~7 minutes
  # of wall clock waiting for a collision that could not happen.
  max_parallel_agents: 6
  # The two that actually bound cost, because growth is quadratic per agent.
  max_turns_per_agent: 30
  # 4, not 5: at ~4 turns a scenario plus 6 overhead that is ~22 turns, well
  # clear of the ceiling. Three agents were killed at exactly 40 turns on the
  # last run, and a mid-task kill costs a whole agent.
  max_scenarios_per_agent: 4
  # The orchestrator is the one agent that cannot be split, and it was 23% of a
  # real run's cost across 106 turns — most of them navigation, artifact edits
  # and un-batched ledger writes. This is the budget it should keep to.
  max_turns_orchestrator: 30
  # Left unspent so the run can always close itself. Hitting a limit mid-run is
  # a normal event; a run that cannot record what it did is worse than one that
  # stopped early.
  reserve_tokens: 400_000
  # stop-and-report | warn
  on_exceed: stop-and-report
